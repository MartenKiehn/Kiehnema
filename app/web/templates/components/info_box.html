{% macro info_box(title, heading_id) %}

  <header class="info-box-heading">
    <div><p class="eyebrow">PRODUCTION NOTES</p><h2 id="{{ heading_id }}">{{ title }}</h2></div>
    <svg class="info-box-slate" viewBox="0 0 44 40" fill="none" aria-hidden="true" focusable="false">
      <path d="M5 17h34v17a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V17Z" stroke="currentColor" stroke-width="1.5"/>
      <path d="m4 8 33-5 1 8-33 5-1-8Z" fill="currentColor"/>
      <path d="m12 7-3 8m13-10-3 8m13-10-3 8" stroke="var(--white)" stroke-width="3"/>
      <path d="M5 25h34M16 25v12M29 25v12" stroke="currentColor" stroke-width="1.5"/>
    </svg>
  </header>
  {{ caller() }}
</aside>
{% endmacro %}
