<div class="backstage-navigation">
  <p class="eyebrow">BACKSTAGE</p>
  <nav class="backstage-tabs" aria-label="Backstage sections">
    <a href="/admin" {% if not path.startswith(('/admin/provider', '/admin/updates', '/admin/video-requests', '/admin/activity')) %}aria-current="page"{% endif %}>Users</a>
    {% if request.state.user.admin %}
    <a href="/admin/video-requests" {% if path == '/admin/video-requests' %}aria-current="page"{% endif %}>Video requests</a>
    <a href="/admin/activity" {% if path == '/admin/activity' %}aria-current="page"{% endif %}>Activity log</a>
    <a href="/admin/provider" {% if path.startswith('/admin/provider') %}aria-current="page"{% endif %}>AI provider</a>
    {% endif %}
    <a href="/admin/updates" {% if path.startswith('/admin/updates') %}aria-current="page"{% endif %}>Updates</a>
  </nav>
</div>
