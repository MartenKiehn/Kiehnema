<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"allowEval":false,"includeIndicatorStyles":false}'>
  <title>{% block title %}Kiehnema · Website to video{% endblock %}</title>
  <meta name="application-name" content="Kiehnema">
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', path='favicon.ico') }}" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='kiehnema.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
  <script src="{{ url_for('static', path='vendor/htmx.min.js') }}" defer></script>
  <script src="{{ url_for('static', path='app.js') }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="top">
    <a class="wordmark" href="/" aria-label="Kiehnema home"><img class="brand-icon" src="{{ url_for('static', path='kiehnema.svg') }}" width="44" height="44" alt=""> Kiehnema</a>
    <nav aria-label="Main navigation"><a href="/#jobs">Your videos</a><a class="button small" href="/">+ New video</a></nav>
  </header>
  <main id="main">{% block content %}{% endblock %}</main>
  <footer class="footer"><span>Made from your website. Directed by you.</span><span class="local"><i aria-hidden="true"></i> Local workspace</span></footer>
</body>
</html>
