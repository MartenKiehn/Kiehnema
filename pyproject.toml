[project]
name = "kiehnema"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=45",
    "defusedxml>=0.7.1",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "imageio-ffmpeg>=0.6.0",
    "jinja2>=3.1.6",
    "langchain-aws>=1.8.0",
    "langchain-core>=1.6.6",
    "langgraph>=1.2.13",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "playwright>=1.63.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyotp>=2.9",
    "python-multipart>=0.0.32",
    "scipy>=1.18.1",
    "tink>=1.12",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["browser: real Chromium UI checks (no Bedrock calls)"]
