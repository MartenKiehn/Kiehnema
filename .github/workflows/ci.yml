name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'New version (MAJOR.MINOR.PATCH, no v). Current version is shown at the top of README.'
        required: true
        type: string
      notes:
        description: 'Release notes'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kiehnema-ci
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare release on main
    if: github.repository == 'MartenKiehn/Kiehnema' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.prepare.outputs.commit }}
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install the lockfile tool
        run: python -m pip install uv==0.12.1
      - name: Commit version and notes, then create the tag
        id: prepare
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: python -m scripts.prepare_release

  test:
    name: Test (${{ matrix.arch }})
    needs: prepare
    if: ${{ !cancelled() && (needs.prepare.result == 'success' || (needs.prepare.result == 'skipped' && github.event_name == 'push')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.arch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.commit || github.sha }}
          persist-credentials: false
      - name: Prepare the disposable Linux host
        run: |
          sudo swapoff -a
          # Allow Chromium's user-namespace sandbox on Ubuntu's hosted VM.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          docker info
      - name: Run the test suite in the application sandbox
        run: |
          docker build --target test -t kiehnema-tests .
          docker run --rm --cap-drop ALL --security-opt no-new-privileges \
            --security-opt seccomp=deploy/chromium-seccomp.json \
            kiehnema-tests python -m pytest -q -o cache_dir=/tmp/pytest-cache
      - name: Test container updates and recovery
        run: |
          docker build --target runtime -t kiehnema-update-dev:0.1.0 .
          docker build --target gateway -t kiehnema-update-gateway .
          docker build --target integration -t kiehnema-update-integration .
          docker run --rm --network host -e DOCKER_DEFAULT_PLATFORM \
            -v /var/run/docker.sock:/var/run/docker.sock kiehnema-update-integration

  release:
    name: Publish signed GitHub release
    needs: [prepare, test]
    if: ${{ !cancelled() && needs.test.result == 'success' && github.repository == 'MartenKiehn/Kiehnema' && (needs.prepare.result == 'success' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: release
    permissions:
      contents: write
      packages: write
    env:
      IMAGE_REPOSITORY: ghcr.io/martenkiehn/kiehnema
      KIEHNEMA_RELEASE_COMMIT: ${{ needs.prepare.outputs.commit || github.sha }}
      KIEHNEMA_RELEASE_TAG: ${{ needs.prepare.outputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install release dependencies
        run: |
          python -m pip install uv==0.12.1
          uv sync --frozen --no-dev
      - name: Verify the release ref and tested commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --no-sync python -m scripts.release check
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and push both image platforms to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker buildx build --platform linux/amd64,linux/arm64 --target runtime --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --metadata-file app-image.json --tag "$IMAGE_REPOSITORY:$KIEHNEMA_RELEASE_TAG" --push .
          docker buildx build --platform linux/amd64,linux/arm64 --target gateway --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --metadata-file gateway-image.json --tag "$IMAGE_REPOSITORY/gateway:$KIEHNEMA_RELEASE_TAG" --push .
      - name: Sign and publish the release manifest and server installer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KIEHNEMA_SIGNING_KEY_PEM: ${{ secrets.KIEHNEMA_SIGNING_KEY_PEM }}
          KIEHNEMA_SIGNING_KEY_ID: ${{ vars.KIEHNEMA_SIGNING_KEY_ID }}
        run: |
          umask 077
          export KIEHNEMA_SIGNING_KEY="$RUNNER_TEMP/release.pem"
          trap 'rm -f "$KIEHNEMA_SIGNING_KEY"' EXIT
          printf '%s' "$KIEHNEMA_SIGNING_KEY_PEM" > "$KIEHNEMA_SIGNING_KEY"
          unset KIEHNEMA_SIGNING_KEY_PEM
          uv run --no-sync python -m scripts.release publish --app-metadata app-image.json --gateway-metadata gateway-image.json --notes deploy/release-notes.md
