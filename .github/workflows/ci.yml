name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare the disposable Linux host
        run: |
          sudo swapoff -a
          # Allow Chromium's user-namespace sandbox on Ubuntu's hosted VM.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          docker info
      - name: Run the test suite in the application sandbox
        run: |
          docker build --target test -t kiehnema-tests .
          docker run --rm --cap-drop ALL --security-opt no-new-privileges \
            --security-opt seccomp=deploy/chromium-seccomp.json \
            kiehnema-tests python -m pytest -q -o cache_dir=/tmp/pytest-cache
      - name: Test container updates and recovery
        run: |
          docker build --target runtime -t kiehnema-update-dev:0.1.0 .
          docker build --target gateway -t kiehnema-update-gateway .
          docker build --target integration -t kiehnema-update-integration .
          docker run --rm --network host -e DOCKER_DEFAULT_PLATFORM \
            -v /var/run/docker.sock:/var/run/docker.sock kiehnema-update-integration

  release:
    name: Publish signed GitLab release
    needs: test
    if: github.repository == 'MartenKiehn/Kiehnema' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: release
    concurrency:
      group: release-publication
      cancel-in-progress: false
    env:
      GITLAB_API_URL: https://git.timeglass.de/api/v4
      GITLAB_PROJECT_ID: mkiehn/kiehnema
      GITLAB_REGISTRY_IMAGE: ${{ vars.GITLAB_REGISTRY_IMAGE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install release dependencies
        run: |
          python -m pip install uv==0.12.1
          uv sync --frozen --no-dev
      - name: Verify the matching protected tag on GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: uv run --no-sync python -m scripts.release check
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and push both image platforms to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_REGISTRY_USER: ${{ secrets.GITLAB_REGISTRY_USER }}
        run: |
          test -n "$GITLAB_REGISTRY_IMAGE"
          test -n "$GITLAB_TOKEN"
          test -n "$GITLAB_REGISTRY_USER"
          printf '%s' "$GITLAB_TOKEN" | docker login "${GITLAB_REGISTRY_IMAGE%%/*}" -u "$GITLAB_REGISTRY_USER" --password-stdin
          trap 'docker logout "${GITLAB_REGISTRY_IMAGE%%/*}"' EXIT
          docker buildx build --platform linux/amd64,linux/arm64 --target runtime --metadata-file app-image.json --tag "$GITLAB_REGISTRY_IMAGE:$GITHUB_REF_NAME" --push .
          docker buildx build --platform linux/amd64,linux/arm64 --target gateway --metadata-file gateway-image.json --tag "$GITLAB_REGISTRY_IMAGE/gateway:$GITHUB_REF_NAME" --push .
      - name: Sign and publish the release manifest
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          KIEHNEMA_SIGNING_KEY_PEM: ${{ secrets.KIEHNEMA_SIGNING_KEY_PEM }}
          KIEHNEMA_SIGNING_KEY_ID: ${{ vars.KIEHNEMA_SIGNING_KEY_ID }}
        run: |
          umask 077
          export KIEHNEMA_SIGNING_KEY="$RUNNER_TEMP/release.pem"
          trap 'rm -f "$KIEHNEMA_SIGNING_KEY"' EXIT
          printf '%s' "$KIEHNEMA_SIGNING_KEY_PEM" > "$KIEHNEMA_SIGNING_KEY"
          unset KIEHNEMA_SIGNING_KEY_PEM
          uv run --no-sync python -m scripts.release publish --app-metadata app-image.json --gateway-metadata gateway-image.json --notes deploy/release-notes.md
